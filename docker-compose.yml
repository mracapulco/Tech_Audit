services:
  db:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: techaudit
      POSTGRES_PASSWORD: techaudit
      POSTGRES_DB: techaudit
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techaudit -d techaudit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
