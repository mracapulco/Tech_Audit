# Tech Audit completo: banco (PostgreSQL + TimescaleDB), API e portal.
# Configuração no arquivo .env (copie de .env.example). O mesmo arquivo serve
# para testar na máquina local e para a produção.
#
#   docker compose up -d --build      sobe tudo
#   docker compose up -d db           só o banco, para desenvolver com npm
#   docker compose logs -f server     acompanha a API

# Nome fixo do projeto: os contêineres e o volume do banco (techaudit_db-data)
# têm sempre o mesmo nome, seja qual for o nome da pasta onde o código está.
# Sem isso, clonar em outra pasta criaria um banco novo e vazio.
name: techaudit

services:
  db:
    # Versão fixa: homologação e produção rodam a mesma. Para atualizar,
    # troque aqui e veja "Atualizar o TimescaleDB" em docs/DEPLOY.md.
    image: timescale/timescaledb:2.30.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: techaudit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techaudit}
      POSTGRES_DB: techaudit
    networks:
      default:
        # Nome próprio na rede, para não confundir com o "db" de outro sistema
        # (ex.: Tech_Hub) se as redes forem compartilhadas com um proxy.
        aliases: [techaudit-db]
    # Só na própria máquina: o banco nunca fica exposto na rede.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techaudit -d techaudit"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://techaudit:${POSTGRES_PASSWORD:-techaudit}@techaudit-db:5432/techaudit?schema=public
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Porta só dos agentes: responde apenas /v1/*. O portal (/api) fica na
      # 3001, que não é publicada e só o contêiner web acessa.
      AGENT_PORT: 3002
      TZ: America/Sao_Paulo
    # Porta publicada para os agentes (/v1/enroll, /v1/events, /v1/config).
    # BIND_ADDRESS=127.0.0.1 deixa a porta só para um proxy na própria máquina.
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${API_PORT:-3001}:3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      API_URL: http://server:3001
      PUBLIC_AGENT_URL: ${PUBLIC_AGENT_URL:-http://localhost:3001}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TZ: America/Sao_Paulo
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORTAL_PORT:-3000}:3000"

volumes:
  db-data:
